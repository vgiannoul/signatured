# GitHub Pages configuration for signatured
title: signatured
description: Google Workspace Signature Manager
baseurl: "/signatured"
url: "https://vgiannoul.github.io"

# Theme
remote_theme: just-the-docs/just-the-docs

# Logo
logo: "/assets/logo.svg"

# Color scheme - custom scheme with logo colors
color_scheme: signatured

# Search
search_enabled: true
search:
  heading_level: 2
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s/]+/
  rel_url: true
  button: false

# Mermaid diagrams
mermaid:
  version: "9.1.6"

# Heading anchor links
heading_anchors: true

# Aux links for the upper right navigation
aux_links:
  "GitHub Repository":
    - "https://github.com/vgiannoul/signatured"
  "Download Latest Release":
    - "https://github.com/vgiannoul/signatured/releases/latest"

# Makes Aux links open in a new tab
aux_links_new_tab: true

# Footer content
footer_content: "Copyright &copy; 2026 Vasilis Giannoulis. Distributed under the <a href=\"https://github.com/vgiannoul/signatured/blob/main/LICENSE\">MIT License</a>."

# Disable default Just the Docs footer
# Custom footer will be added via _includes/footer_custom.html
just_the_docs:
  collections: {}

# Footer "Edit this page on GitHub" link
gh_edit_link: true
gh_edit_link_text: "Edit this page on GitHub"
gh_edit_repository: "https://github.com/vgiannoul/signatured"
gh_edit_branch: "main"
gh_edit_source: docs
gh_edit_view_mode: "edit"

# Back to top link
back_to_top: true
back_to_top_text: "Back to top"

# Navigation structure
nav_sort: case_sensitive

# Table of contents - show h2 and h3 headings in sidebar
# Applies to all pages unless overridden in frontmatter
# toc_h_min: 2 (default, starts at H2)
# toc_h_max: 3 (includes H2 and H3)
defaults:
  - scope:
      path: ""
    values:
      has_toc: true
      toc_h_min: 2
      toc_h_max: 3

# Callouts
callouts_level: loud
callouts:
  warning:
    title: Warning
    color: red
  note:
    title: Note
    color: blue
  important:
    title: Important
    color: yellow

# Plugins
plugins:
  - jekyll-seo-tag
  - jekyll-github-metadata
  - jekyll-include-cache

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - README.md

# Markdown settings
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    block:
      line_numbers: false

# Compression
compress_html:
  clippings: all
  comments: all
  endings: all
  startings: []
  blanklines: false
  profile: false
